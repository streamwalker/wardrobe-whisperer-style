name: iOS native simulator preview

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:release
      - name: Bundle app using the public production backend configuration
        run: npm run ios:sync
      - name: Build unsigned simulator app
        run: xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/DripSlayerPreview" CODE_SIGNING_ALLOWED=NO build
      - name: Launch iPhone and iPad and capture actual native screens
        run: bash scripts/release/native-preview.sh
        env:
          SIMULATOR_APP: ${{ runner.temp }}/DripSlayerPreview/Build/Products/Debug-iphonesimulator/App.app
      - uses: actions/upload-artifact@v4
        with:
          name: ios-native-preview
          path: artifacts/native-preview/
          retention-days: 7
